<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Claudia das Públicas diante da tragédia da cultura</title>
  <desc id="d">Uma mulher negra de cabelos crespos, blusa laranja, ergue um cartão com uma apresentação diante de uma hidra de oito cabeças; cada cabeça é um campo do saber que acumula evidências sem que elas cheguem a quem decide.</desc>
  <defs>
    <style>
      .lab { font: 700 15px Arial, Helvetica, sans-serif; fill: #4d4d4d; }
      .tag { fill: #fff; stroke: #cccccc; stroke-width: 1.2; }
      .cap { font: 700 20px Arial, Helvetica, sans-serif; }
      .sub { font: 400 14px Arial, Helvetica, sans-serif; fill: #808080; }
      .neck { fill: none; stroke: #4a3f37; stroke-width: 26; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- ground -->
  <line x1="40" y1="560" x2="1160" y2="560" stroke="#cccccc" stroke-width="2"/>

  <!-- HYDRA: the tragedy of culture -->
  <g id="hidra">
    <path d="M150 540 C 90 545, 60 520, 70 490 C 80 470, 110 480, 120 500" fill="none" stroke="#4a3f37" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="300" cy="490" rx="170" ry="70" fill="#4a3f37"/>
    <ellipse cx="300" cy="505" rx="120" ry="38" fill="#5c5047"/>
    <path d="M200 545 l-12 20 h30 z M380 545 l-10 20 h30 z" fill="#4a3f37"/>
    <!-- necks -->
    <path class="neck" d="M200 460 C 150 380, 110 330, 95 250"/>
    <path class="neck" d="M235 440 C 210 340, 200 260, 200 160"/>
    <path class="neck" d="M270 430 C 270 330, 290 230, 310 110"/>
    <path class="neck" d="M310 430 C 330 330, 380 240, 420 150"/>
    <path class="neck" d="M350 440 C 400 370, 460 310, 515 250"/>
    <path class="neck" d="M380 455 C 440 420, 500 390, 560 360"/>
    <path class="neck" d="M170 475 C 110 440, 70 400, 40 360"/>
    <path class="neck" d="M260 432 C 240 360, 250 300, 255 250"/>
    <!-- heads: each a field of knowledge -->
    <g>
      <g transform="translate(95,240)"><ellipse rx="34" ry="24" fill="#b8401f"/><path d="M14 6 l24 4 l-22 8 z" fill="#7a2a14"/><circle cx="-6" cy="-8" r="5" fill="#fff"/><circle cx="-5" cy="-8" r="2.4" fill="#222"/></g>
      <g transform="translate(200,150)"><ellipse rx="34" ry="24" fill="#33a1b3"/><path d="M14 6 l24 4 l-22 8 z" fill="#1f6a76"/><circle cx="-6" cy="-8" r="5" fill="#fff"/><circle cx="-5" cy="-8" r="2.4" fill="#222"/></g>
      <g transform="translate(310,100)"><ellipse rx="34" ry="24" fill="#ed5635"/><path d="M14 6 l24 4 l-22 8 z" fill="#a83a22"/><circle cx="-6" cy="-8" r="5" fill="#fff"/><circle cx="-5" cy="-8" r="2.4" fill="#222"/></g>
      <g transform="translate(420,140)"><ellipse rx="34" ry="24" fill="#6b7f3a"/><path d="M14 6 l24 4 l-22 8 z" fill="#46542a"/><circle cx="-6" cy="-8" r="5" fill="#fff"/><circle cx="-5" cy="-8" r="2.4" fill="#222"/></g>
      <g transform="translate(515,240)"><ellipse rx="34" ry="24" fill="#2c3e50"/><path d="M14 6 l24 4 l-22 8 z" fill="#1a2632"/><circle cx="-6" cy="-8" r="5" fill="#fff"/><circle cx="-5" cy="-8" r="2.4" fill="#222"/></g>
      <g transform="translate(565,355)"><ellipse rx="34" ry="24" fill="#8a5a9e"/><path d="M14 6 l24 4 l-22 8 z" fill="#5e3d6c"/><circle cx="-6" cy="-8" r="5" fill="#fff"/><circle cx="-5" cy="-8" r="2.4" fill="#222"/></g>
      <g transform="translate(40,350)"><ellipse rx="34" ry="24" fill="#c9962b"/><path d="M-14 6 l-24 4 l22 8 z" fill="#8a671d"/><circle cx="6" cy="-8" r="5" fill="#fff"/><circle cx="5" cy="-8" r="2.4" fill="#222"/></g>
      <g transform="translate(255,245)"><ellipse rx="30" ry="21" fill="#9e3b4b"/><path d="M12 6 l22 4 l-20 7 z" fill="#6c2833"/><circle cx="-6" cy="-7" r="4.5" fill="#fff"/><circle cx="-5" cy="-7" r="2.2" fill="#222"/></g>
    </g>
    <!-- labels -->
    <g>
      <rect class="tag" x="22" y="190" width="106" height="24" rx="12"/><text class="lab" x="75" y="207" text-anchor="middle">Economia</text>
      <rect class="tag" x="160" y="98" width="80" height="24" rx="12"/><text class="lab" x="200" y="115" text-anchor="middle">Saúde</text>
      <rect class="tag" x="262" y="48" width="98" height="24" rx="12"/><text class="lab" x="311" y="65" text-anchor="middle">Educação</text>
      <rect class="tag" x="378" y="88" width="86" height="24" rx="12"/><text class="lab" x="421" y="105" text-anchor="middle">Direito</text>
      <rect class="tag" x="456" y="188" width="118" height="24" rx="12"/><text class="lab" x="515" y="205" text-anchor="middle">Ciência política</text>
      <rect class="tag" x="510" y="300" width="112" height="24" rx="12"/><text class="lab" x="566" y="317" text-anchor="middle">Psicologia</text>
      <rect class="tag" x="0" y="300" width="106" height="24" rx="12"/><text class="lab" x="53" y="317" text-anchor="middle">Sociologia</text>
      <rect class="tag" x="204" y="200" width="104" height="24" rx="12"/><text class="lab" x="256" y="217" text-anchor="middle">Jornalismo</text>
    </g>
  </g>

  <!-- the card Claudia raises: one piece of evidence, in a form each public can read -->
  <g transform="translate(700,170) rotate(-6)">
    <rect x="0" y="0" width="150" height="96" rx="4" fill="#fff" stroke="#cccccc" stroke-width="2"/>
    <rect x="0" y="0" width="38" height="96" rx="4" fill="#ed5635"/>
    <text x="19" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#fff">I</text>
    <rect x="50" y="20" width="84" height="9" fill="#ed5635"/>
    <rect x="50" y="40" width="74" height="6" fill="#bbbbbb"/>
    <rect x="50" y="54" width="80" height="6" fill="#bbbbbb"/>
    <rect x="50" y="68" width="60" height="6" fill="#bbbbbb"/>
  </g>

  <!-- CLAUDIA -->
  <g id="claudia">
    <!-- hair (behind) -->
    <g fill="#24160f">
      <circle cx="940" cy="190" r="70"/><circle cx="890" cy="215" r="42"/><circle cx="992" cy="214" r="42"/>
      <circle cx="905" cy="150" r="38"/><circle cx="975" cy="148" r="38"/><circle cx="940" cy="128" r="36"/>
      <circle cx="884" cy="262" r="30"/><circle cx="996" cy="262" r="30"/>
    </g>
    <!-- legs and skirt -->
    <rect x="912" y="470" width="20" height="88" rx="8" fill="#7b4a2a"/>
    <rect x="950" y="470" width="20" height="88" rx="8" fill="#7b4a2a"/>
    <path d="M905 556 h34 v6 h-34 z M945 556 h34 v6 h-34 z" fill="#2c3e50"/>
    <path d="M880 380 L1002 380 L1030 490 L852 490 Z" fill="#2c3e50"/>
    <!-- torso: blouse in the slides' orange -->
    <path d="M888 288 Q940 270 994 288 L1006 392 L876 392 Z" fill="#ed5635"/>
    <!-- neck and head -->
    <rect x="928" y="250" width="24" height="34" rx="8" fill="#7b4a2a"/>
    <ellipse cx="940" cy="215" rx="44" ry="50" fill="#8b5a33"/>
    <!-- face -->
    <ellipse cx="924" cy="210" rx="4.5" ry="5.5" fill="#1d120c"/>
    <ellipse cx="956" cy="210" rx="4.5" ry="5.5" fill="#1d120c"/>
    <path d="M916 198 q8 -6 16 0 M948 198 q8 -6 16 0" stroke="#24160f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M937 218 q3 10 -2 14" stroke="#6b4226" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M926 240 q14 10 28 0" stroke="#5a2a1c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="895" cy="228" r="5" fill="#c9962b"/><circle cx="985" cy="228" r="5" fill="#c9962b"/>
    <!-- raised arm holding the card -->
    <path d="M892 300 C 860 280, 840 250, 830 222" stroke="#8b5a33" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M892 300 C 875 295, 870 300, 868 310" stroke="#ed5635" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="828" cy="218" r="13" fill="#8b5a33"/>
    <!-- other arm holding a book -->
    <path d="M992 300 C 1016 330, 1022 360, 1010 386" stroke="#8b5a33" stroke-width="20" fill="none" stroke-linecap="round"/>
    <rect x="985" y="372" width="56" height="40" rx="3" fill="#33a1b3" transform="rotate(-10 1013 392)"/>
    <rect x="991" y="378" width="44" height="4" fill="#fff" opacity=".7" transform="rotate(-10 1013 392)"/>
  </g>

  <!-- captions -->
  <text class="cap" x="300" y="600" text-anchor="middle" fill="#4a3f37">A tragédia da cultura</text>
  <text class="cap" x="940" y="600" text-anchor="middle" fill="#ed5635">Claudia das Públicas</text>
</svg>
