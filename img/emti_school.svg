<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A school with a clock on its front: universal full-day high school in Piauí.
       Colours from the paper's figures and slides: #005A32, #469C5F, #A0CD96, gold #C9A227. -->
  <!-- roof -->
  <polygon points="24,3 45,17 3,17" fill="#005A32"/>
  <!-- building -->
  <rect x="6" y="17" width="36" height="25" fill="#469C5F"/>
  <!-- windows -->
  <rect x="9.5" y="22" width="6" height="6" rx="1" fill="#A0CD96"/>
  <rect x="32.5" y="22" width="6" height="6" rx="1" fill="#A0CD96"/>
  <rect x="9.5" y="32" width="6" height="6" rx="1" fill="#A0CD96"/>
  <rect x="32.5" y="32" width="6" height="6" rx="1" fill="#A0CD96"/>
  <!-- door -->
  <rect x="20" y="32" width="8" height="10" rx="1" fill="#005A32"/>
  <!-- clock: the full school day -->
  <circle cx="24" cy="23.5" r="6.3" fill="#ffffff" stroke="#C9A227" stroke-width="2"/>
  <path d="M24 19.6 V23.5 L27 25.4" stroke="#005A32" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <!-- ground -->
  <rect x="2" y="42" width="44" height="3" rx="1.5" fill="#005A32"/>
</svg>
