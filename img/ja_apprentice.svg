<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A teenage apprentice with a work badge and a briefcase (icon for the Jovem Aprendiz paper).
       Colours from the paper's topic red: #B52E2F, dark #7A1E1F, light #E8A9A6. -->
  <!-- legs -->
  <path d="M17.5 30 L16 43.5 M22.5 30 L24 43.5" stroke="#7A1E1F" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- body (shirt) -->
  <rect x="13" y="15" width="14" height="17" rx="4.5" fill="#B52E2F"/>
  <!-- work badge on a lanyard -->
  <path d="M17 15.5 L20 22 L23 15.5" stroke="#E8A9A6" stroke-width="1.3" fill="none"/>
  <rect x="17.6" y="21.5" width="4.8" height="5.6" rx="0.9" fill="#ffffff" stroke="#E8A9A6" stroke-width="0.9"/>
  <rect x="18.6" y="24.6" width="2.8" height="0.9" fill="#B52E2F"/>
  <!-- head -->
  <circle cx="20" cy="8.5" r="5.2" fill="#B52E2F"/>
  <!-- arm down to the briefcase -->
  <path d="M26 19 L33 27" stroke="#B52E2F" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <!-- briefcase -->
  <path d="M32 29 V27.3 a1.4 1.4 0 0 1 1.4 -1.4 h3.2 a1.4 1.4 0 0 1 1.4 1.4 V29" stroke="#7A1E1F" stroke-width="1.6" fill="none"/>
  <rect x="28.5" y="29" width="13" height="10" rx="1.6" fill="#7A1E1F"/>
  <rect x="28.5" y="32.6" width="13" height="1.3" fill="#E8A9A6"/>
  <!-- ground -->
  <rect x="9" y="44" width="34" height="2.4" rx="1.2" fill="#7A1E1F"/>
</svg>
