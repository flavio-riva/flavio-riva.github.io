<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A child walking to school with a backpack and a big pencil (icon for the Programa Saúde na Escola paper) -->
  <!-- backpack -->
  <rect x="8.5" y="16" width="7" height="12" rx="2.5" fill="#145c26"/>
  <!-- legs, mid-stride -->
  <path d="M17.5 30 L13 43.5 M20.5 30 L25.5 43.5" stroke="#1e7b34" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- body -->
  <rect x="14" y="15" width="9" height="16.5" rx="4" fill="#1e7b34"/>
  <!-- head -->
  <circle cx="18.5" cy="8.5" r="5.2" fill="#1e7b34"/>
  <!-- pencil, held like a walking stick -->
  <g transform="rotate(14 36 26)">
    <rect x="33.5" y="7" width="5" height="3.5" rx="1.2" fill="#e98ca8"/>
    <rect x="33.5" y="10.5" width="5" height="2.2" fill="#9aa3ad"/>
    <rect x="33.5" y="12.7" width="5" height="25.3" fill="#f2b705"/>
    <polygon points="33.5,38 38.5,38 36,44.5" fill="#e9c48a"/>
    <polygon points="35.1,42.2 36.9,42.2 36,44.5" fill="#2b2b2b"/>
  </g>
  <!-- arm reaching to the pencil -->
  <path d="M21 19.5 L33.5 25" stroke="#1e7b34" stroke-width="3.6" stroke-linecap="round" fill="none"/>
</svg>
